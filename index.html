<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD JSONBin - Data Orang</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { max-width: 800px; margin: 40px auto; padding: 0 16px; background: #f5f7fa; color: #1a202c; }
    h1 { font-size: 1.5rem; margin-bottom: 20px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 24px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    input { flex: 1; min-width: 150px; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: #3b82f6; }
    button { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; transition: opacity .2s; }
    button:hover { opacity: .85; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-edit { background: #f59e0b; color: white; padding: 6px 12px; font-size: 13px; }
    .btn-delete { background: #ef4444; color: white; padding: 6px 12px; font-size: 13px; }
    .btn-cancel { background: #e2e8f0; color: #1a202c; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #edf2f7; font-size: 14px; }
    th { background: #f8fafc; font-weight: 600; color: #4a5568; }
    tr:hover td { background: #f8fafc; }
    .empty { text-align: center; color: #a0aec0; padding: 24px; }
    .status { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .status.error { color: #ef4444; }
    .status.success { color: #10b981; }
  </style>
</head>
<body>

  <h1>📋 CRUD Data Orang (JSONBin)</h1>

  <div class="card">
    <h2 style="font-size:1rem;margin-top:0;" id="formTitle">Tambah Data</h2>
    <form id="dataForm">
      <input type="hidden" id="editIndex" value="-1">
      <div class="form-row">
        <input type="text" id="nama" placeholder="Nama" required>
        <input type="number" id="umur" placeholder="Umur" min="1" required>
        <button type="submit" class="btn-primary" id="submitBtn">Simpan</button>
        <button type="button" class="btn-cancel" id="cancelBtn" style="display:none;">Batal</button>
      </div>
    </form>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:50px;">No</th>
          <th>Nama</th>
          <th style="width:100px;">Umur</th>
          <th style="width:160px;">Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" class="empty">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

<script>
  // ==== KONFIGURASI ====
  const BIN_ID = "6afa937fffd5d16053c4a171";
  const MASTER_KEY = "$2a$10$NgDwglB8VwjLBDmG.GV81OVEGrrFJXJfskmxEscDsz1NxZxWel7AS";
  const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

  // State lokal
  let dataOrang = [];

  // Elemen DOM
  const tableBody = document.getElementById("tableBody");
  const form = document.getElementById("dataForm");
  const namaInput = document.getElementById("nama");
  const umurInput = document.getElementById("umur");
  const editIndexInput = document.getElementById("editIndex");
  const submitBtn = document.getElementById("submitBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const formTitle = document.getElementById("formTitle");
  const statusEl = document.getElementById("status");

  // ==== UTIL ====
  function setStatus(msg, type = "") {
    statusEl.textContent = msg;
    statusEl.className = "status " + type;
  }

  function showLoading() {
    tableBody.innerHTML = `<tr><td colspan="4" class="empty">Memuat data...</td></tr>`;
  }

  // ==== READ (GET) ====
  async function loadData() {
    showLoading();
    try {
      const res = await fetch(`${BASE_URL}/latest`, {
        headers: { "X-Master-Key": MASTER_KEY }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      // Data asli ada di json.record
      dataOrang = Array.isArray(json.record) ? json.record : [];
      renderTable();
    } catch (err) {
      tableBody.innerHTML = `<tr><td colspan="4" class="empty">Gagal memuat: ${err.message}</td></tr>`;
      setStatus("Gagal memuat data: " + err.message, "error");
    }
  }

  // ==== RENDER TABEL ====
  function renderTable() {
    if (dataOrang.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="4" class="empty">Belum ada data. Tambahkan data pertama!</td></tr>`;
      return;
    }
    tableBody.innerHTML = dataOrang.map((item, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${escapeHtml(item.nama)}</td>
        <td>${item.umur}</td>
        <td>
          <button class="btn-edit" onclick="editData(${i})">Edit</button>
          <button class="btn-delete" onclick="hapusData(${i})">Hapus</button>
        </td>
      </tr>
    `).join("");
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // ==== CREATE & UPDATE (PUT seluruh array) ====
  async function simpanKeServer(pesanSukses) {
    setStatus("Menyimpan...", "");
    try {
      const res = await fetch(BASE_URL, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": MASTER_KEY
        },
        body: JSON.stringify(dataOrang)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      renderTable();
      setStatus(pesanSukses, "success");
    } catch (err) {
      setStatus("Gagal menyimpan: " + err.message, "error");
    }
  }

  // ==== SUBMIT FORM (Create / Update) ====
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nama = namaInput.value.trim();
    const umur = parseInt(umurInput.value, 10);
    if (!nama || isNaN(umur)) {
      setStatus("Nama dan umur wajib diisi dengan benar.", "error");
      return;
    }

    const editIndex = parseInt(editIndexInput.value, 10);

    if (editIndex === -1) {
      // CREATE
      dataOrang.push({ nama, umur });
      await simpanKeServer("Data berhasil ditambahkan!");
    } else {
      // UPDATE
      dataOrang[editIndex] = { nama, umur };
      await simpanKeServer("Data berhasil diperbarui!");
      resetForm();
    }

    if (editIndex === -1) {
      form.reset();
      namaInput.focus();
    }
  });

  // ==== EDIT ====
  function editData(index) {
    const item = dataOrang[index];
    namaInput.value = item.nama;
    umurInput.value = item.umur;
    editIndexInput.value = index;
    formTitle.textContent = "Edit Data";
    submitBtn.textContent = "Update";
    cancelBtn.style.display = "inline-block";
    setStatus(`Mengedit data ke-${index + 1}`, "");
    namaInput.focus();
  }

  // ==== CANCEL EDIT ====
  function resetForm() {
    form.reset();
    editIndexInput.value = "-1";
    formTitle.textContent = "Tambah Data";
    submitBtn.textContent = "Simpan";
    cancelBtn.style.display = "none";
  }
  cancelBtn.addEventListener("click", () => {
    resetForm();
    setStatus("");
  });

  // ==== DELETE ====
  async function hapusData(index) {
    if (!confirm(`Hapus data "${dataOrang[index].nama}"?`)) return;
    dataOrang.splice(index, 1);
    await simpanKeServer("Data berhasil dihapus!");
  }

  // ==== INIT ====
  loadData();
</script>
</body>
</html>
