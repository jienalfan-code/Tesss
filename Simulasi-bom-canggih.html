<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💥 Bom Nuklir · Skala Mikro + Kontrol Penuh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #05070a;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }

        /* Panel dashboard — di tengah atas */
        #panel {
            position: absolute;
            top: 0;
            left: 45%;
            transform: translateX(-50%);
            background: rgba(10, 15, 25, 0.92);
            padding: 6px 14px;
            border-radius: 0 0 12px 12px;
            border-bottom: 1px solid #ff3300;
            border-left: 1px solid #ff3300;
            border-right: 1px solid #ff3300;
            box-shadow: 0 0 25px rgba(255, 51, 0, 0.25);
            pointer-events: none;
            min-width: 180px;
            max-width: 260px;
            backdrop-filter: blur(4px);
            color: #a5c6d4;
            font-size: 11px;
            z-index: 10;
            text-align: center;
            transition: opacity 0.3s;
        }
        #panel h2 {
            margin: 0 0 2px 0;
            font-size: 13px;
            color: #ff3300;
            text-shadow: 0 0 8px #ff3300;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        #panel .row {
            display: flex;
            justify-content: space-between;
            margin: 1px 0;
            white-space: nowrap;
            gap: 10px;
            font-size: 10px;
        }
        #panel .val {
            color: #fff;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        #status {
            color: #ffcc00;
            font-weight: bold;
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 10px;
            white-space: normal;
            line-height: 1.3;
            min-height: 2.2em;
        }
        .status-damage {
            color: #ff8844;
        }

        /* Kontrol kanan atas — lebih lebar */
        #controls {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(10, 15, 25, 0.92);
            padding: 8px 14px;
            border-radius: 0 0 0 12px;
            border-left: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 3px;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            font-size: 10px;
            color: #a5c6d4;
            width: 200px;   /* diperlebar */
          /*  max-width: 240px;   /* diperlebar */
            z-index: 10;
            transition: transform 0.3s ease, opacity 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        #controls.hidden {
            transform: translateX(110%);
            opacity: 0;
            pointer-events: none;
        }
        #controls .ctrl-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1px;
            flex-wrap: nowrap;
        }
        .ctrl-label {
            font-weight: 500;
            color: #c5c6c7;
            min-width: 38px;
            font-size: 9px;
            white-space: nowrap;
            background: deepskyble;
        }
        .ctrl-row { 
            background: deeppnk;
        }
        #controls input[type="range"] {
            min-width: 1130px !importan;       /* lebih panjang */
            accent-color: #ff3300;
            background: transparent;
            cursor: pointer;
        }
        #controls input[type="number"] {
            width: 40px;
            padding: 1px 2px;
            background: rgba(255,255,255,0.08);
            border: 1px solid #2a3a4a;
            border-radius: 3px;
            color: #fff;
            font-weight: bold;
            text-align: center;
            font-size: 9px;
        }
        #controls button {
            background: #ff3300;
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 9px;
            box-shadow: 0 0 12px rgba(255,51,0,0.3);
            white-space: nowrap;
        }
        #controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,51,0,0.6);
        }
        .ctrl-value {
            min-width: 24px;
            text-align: center;
            color: #fff;
            font-weight: bold;
            font-size: 9px;
        }
        #controls .hint {
            font-size: 7px;
            color: rgba(255,255,255,0.2);
            text-align: center;
            margin-top: 1px;
        }
        #toggleControls {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #a5c6d4;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            cursor: pointer;
            z-index: 11;
            backdrop-filter: blur(4px);
            pointer-events: auto;
        }
        #toggleControls:hover {
            background: rgba(255,255,255,0.1);
        }

        @media (max-width: 720px) {
            #panel { left: 50%; min-width: 120px; padding: 4px 10px; font-size: 9px; }
            #panel h2 { font-size: 11px; }
            #controls { min-width: 160px; padding: 6px 10px; }
            .ctrl-label { min-width: 30px; font-size: 8px; }
            #controls input[type="range"] { width: 50px; }
        }
    </style>
</head>
<body>

    <!-- Toggle kontrol -->
    <button id="toggleControls">⚙️</button>

    <!-- Panel dashboard di tengah atas -->
    <div id="panel">
        <h2>☢️ BOM NUKLIR</h2>
        <div class="row"><span>Uranium</span><span id="u-count" class="val">0</span></div>
        <div class="row"><span>Kota</span><span id="c-count" class="val">0</span></div>
        <div class="row"><span>Partikel</span><span id="p-count" class="val">0</span></div>
        <div class="row"><span>Energi</span><span id="energy" class="val">0</span></div>
        <div id="status">💤 Bom belum diaktifkan</div>
    </div>

    <!-- Kontrol kanan atas (lebih lebar) -->
    <div id="controls">
        <div class="ctrl-row">
            <span class="ctrl-label">Bom X</span>
            <input type="range" id="bombX" min="0" max="100" value="3" />
            <span class="ctrl-value" id="bombXval">3%</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Bom Y</span>
            <input type="range" id="bombY" min="0" max="100" value="3" />
            <span class="ctrl-value" id="bombYval">3%</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Bom size</span>
            <input type="range" id="bombSize" min="1" max="20" value="7" />
            <span class="ctrl-value" id="bombSizeVal">7</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Kota X</span>
            <input type="range" id="cityX" min="0" max="100" value="50" />
            <span class="ctrl-value" id="cityXval">50%</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Kota Y</span>
            <input type="range" id="cityY" min="0" max="100" value="50" />
            <span class="ctrl-value" id="cityYval">50%</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Kota size</span>
            <input type="range" id="cityScale" min="30" max="200" value="100" />
            <span class="ctrl-value" id="cityScaleVal">100%</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Uranium</span>
            <input type="number" id="inputU" value="300" min="10" max="5000" step="10" />
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Kota atom</span>
            <input type="number" id="inputC" value="2000" min="100" max="10000" step="100" />
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Kecepatan</span>
            <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1.0" />
            <span class="ctrl-value" id="speedLabel">1.0</span>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Neutron/klik</span>
            <input type="number" id="neutronPerClick" value="1" min="1" max="20" step="1" />
        </div>
        <div class="ctrl-row">
            <span class="ctrl-label">Batas partikel</span>
            <input type="number" id="maxParticles" value="10000" min="100" max="50000" step="100" />
        </div>
        <div class="ctrl-row" style="justify-content:center; gap:6px; margin-top:2px;">
            <button id="resetBtn">🔄 Reset</button>
            <span class="hint">klik canvas</span>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // ============================================================
        //  SIMULASI BOM NUKLIR vs KOTA — SKALA 1px + KONTROL PENUH
        //  Logika status "fisi selesai" diperbaiki
        // ============================================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // DOM refs
        const uCountEl = document.getElementById('u-count');
        const cCountEl = document.getElementById('c-count');
        const pCountEl = document.getElementById('p-count');
        const energyEl = document.getElementById('energy');
        const statusEl = document.getElementById('status');
        const inputU = document.getElementById('inputU');
        const inputC = document.getElementById('inputC');
        const speedSlider = document.getElementById('speedSlider');
        const speedLabel = document.getElementById('speedLabel');
        const neutronPerClick = document.getElementById('neutronPerClick');
        const maxParticlesInput = document.getElementById('maxParticles');
        const resetBtn = document.getElementById('resetBtn');
        const toggleBtn = document.getElementById('toggleControls');
        const controlsDiv = document.getElementById('controls');

        // Slider posisi & ukuran
        const bombXSlider = document.getElementById('bombX');
        const bombYSlider = document.getElementById('bombY');
        const bombSizeSlider = document.getElementById('bombSize');
        const cityXSlider = document.getElementById('cityX');
        const cityYSlider = document.getElementById('cityY');
        const cityScaleSlider = document.getElementById('cityScale');
        const bombXval = document.getElementById('bombXval');
        const bombYval = document.getElementById('bombYval');
        const bombSizeVal = document.getElementById('bombSizeVal');
        const cityXval = document.getElementById('cityXval');
        const cityYval = document.getElementById('cityYval');
        const cityScaleVal = document.getElementById('cityScaleVal');

        // ----- State -----
        let atoms = [];
        let particles = [];
        let energyFlashes = [];
        let shockwave = null;
        let bigWave = null;
        let totalEnergy = 0;
        let speed = 1.0;
        let screenShake = 0;
        let shockwaveActive = false;

        // Status pelacakan
        let status = {
            phase: 'idle', // idle | arming | ignition | fizzle | chain | wave | city_damage | city_destroyed
            uraniumTotal: 0,
            uraniumSplit: 0,
            cityTotal: 0,
            cityDestroyed: 0,
            firstFission: false,
            firstCityHit: false,
            lastFissionTime: 0,
            fizzleCheckDone: false,
            waveTriggered: false,   // apakah status wave sudah pernah dipicu
        };

        // Konfigurasi ukuran 1px
        const CONFIG = {
            ATOM_RADIUS: 0.8,
            PARTICLE_RADIUS: 0.8,
            NEUTRON_SPEED: 5.0,
            PROTON_SPEED: 4.0,
            ELECTRON_SPEED: 6.0,
            FISSION_NEUTRONS: 3,
            ENERGY_PER_FISSION: 15,
            PARTICLE_DAMP: 0.998,
            FLASH_DECAY: 0.02,
            WAVE_SPEED: 8.0,
            WAVE_MAX_RADIUS: 1.8,
            SHAKE_DECAY: 0.94,
            FIZZLE_TIMEOUT: 1500, // ms tanpa fisi baru untuk dianggap berhenti
        };

        function getMaxParticles() {
            return parseInt(maxParticlesInput.value) || 10000;
        }

        function rand(min, max) { return Math.random() * (max - min) + min; }

        // ----- Bangun dunia dengan parameter dinamis -----
        function buildWorld() {
            atoms = [];
            particles = [];
            energyFlashes = [];
            totalEnergy = 0;
            screenShake = 0;
            shockwave = null;
            bigWave = null;
            shockwaveActive = false;

            // Reset status
            status.phase = 'idle';
            status.uraniumTotal = 0;
            status.uraniumSplit = 0;
            status.cityTotal = 0;
            status.cityDestroyed = 0;
            status.firstFission = false;
            status.firstCityHit = false;
            status.lastFissionTime = 0;
            status.fizzleCheckDone = false;
            status.waveTriggered = false;

            const uCount = parseInt(inputU.value) || 300;
            const cCount = parseInt(inputC.value) || 2000;

            // Baca posisi & ukuran dari slider
            const bombX = (parseFloat(bombXSlider.value) / 100) * W;
            const bombY = (parseFloat(bombYSlider.value) / 100) * H;
            const bombSize = parseFloat(bombSizeSlider.value) * 0.5;
            const cityX = (parseFloat(cityXSlider.value) / 100) * W;
            const cityY = (parseFloat(cityYSlider.value) / 100) * H;
            const cityScale = parseFloat(cityScaleSlider.value) / 100;

            // 1. Bom Uranium (lingkaran)
            const bombRadius = Math.min(W, H) * 0.04 * bombSize;
            for (let i = 0; i < uCount; i++) {
                const angle = rand(0, Math.PI * 2);
                const dist = rand(0, bombRadius);
                const x = bombX + Math.cos(angle) * dist;
                const y = bombY + Math.sin(angle) * dist;
                atoms.push({ x, y, isUranium: true, isSplit: false, vibration: 0 });
            }
            status.uraniumTotal = uCount;

            // 2. Kota (bangunan persegi panjang) dengan skala
            const spacing = 3;
            const baseBuildings = [
                { w: 120, h: 220 },
                { w: 150, h: 280 },
                { w: 100, h: 180 },
                { w: 130, h: 240 },
                { w: 80, h: 130 },
            ];
            const scaled = baseBuildings.map(b => ({
                w: b.w * cityScale,
                h: b.h * cityScale,
            }));
            const totalW = scaled.reduce((s, b) => s + b.w, 0) + (scaled.length - 1) * 20;
            const totalH = Math.max(...scaled.map(b => b.h));
            let startX = cityX - totalW / 2;
            let startY = cityY - totalH / 2;

            let count = 0;
            for (let b of scaled) {
                for (let x = startX; x < startX + b.w; x += spacing) {
                    for (let y = startY; y < startY + b.h; y += spacing) {
                        if (count >= cCount) break;
                        if (x > 0 && x < W && y > 0 && y < H && Math.random() < 0.85) {
                            atoms.push({
                                x: x + rand(-1, 1),
                                y: y + rand(-1, 1),
                                isUranium: false,
                                isSplit: false,
                                vibration: 0
                            });
                            count++;
                        }
                    }
                    if (count >= cCount) break;
                }
                startX += b.w + 20;
                if (count >= cCount) break;
            }
            while (count < cCount) {
                const x = rand(cityX - totalW/2, cityX + totalW/2);
                const y = rand(cityY - totalH/2, cityY + totalH/2);
                if (x > 0 && x < W && y > 0 && y < H) {
                    atoms.push({ x, y, isUranium: false, isSplit: false, vibration: 0 });
                    count++;
                }
            }
            status.cityTotal = count;

            window.bombPos = { x: bombX, y: bombY };
            updateUI();
            updateStatus();
        }

        // ----- Fungsi update status cerdas (diperbaiki) -----
        function updateStatus() {
            const uTotal = status.uraniumTotal;
            const uSplit = status.uraniumSplit;
            const cTotal = status.cityTotal;
            const cDestroyed = status.cityDestroyed;
            const pctU = uTotal > 0 ? (uSplit / uTotal) * 100 : 0;
            const pctC = cTotal > 0 ? (cDestroyed / cTotal) * 100 : 0;

            let damageLabel = '';
            if (cTotal === 0) damageLabel = 'Kota kosong';
            else if (pctC === 0) damageLabel = 'Kota utuh';
            else if (pctC < 10) damageLabel = 'Kerusakan tipis';
            else if (pctC < 25) damageLabel = 'Kerusakan ringan';
            else if (pctC < 50) damageLabel = 'Kehancuran sedang';
            else if (pctC < 75) damageLabel = 'Kehancuran lumayan';
            else if (pctC < 90) damageLabel = 'Kehancuran parah';
            else if (pctC < 100) damageLabel = 'Hampir ludes';
            else damageLabel = 'Ludes hangus';

            let mainStatus = '';
            let color = '#ffcc00';

            // Tentukan status utama berdasarkan phase
            switch (status.phase) {
                case 'idle':
                    mainStatus = '💤 Bom belum diaktifkan';
                    color = '#ffcc00';
                    break;
                case 'arming':
                    mainStatus = '🔑 Bom sedang diaktifkan...';
                    color = '#ffaa44';
                    break;
                case 'ignition':
                    mainStatus = '🔥 Bom mulai menyala!';
                    color = '#ff6600';
                    break;
                case 'fizzle':
                    mainStatus = '💔 Fisi gagal, bom kembali nonaktif.';
                    color = '#ff4444';
                    break;
                case 'chain':
                    mainStatus = `☢️ Fisi nuklir berlangsung! (${pctU.toFixed(1)}%)`;
                    color = '#ff3300';
                    break;
                case 'wave':
                    mainStatus = '🌊 Fisi selesai, gelombang hancur menuju kota!';
                    color = '#ff8844';
                    break;
                case 'city_damage':
                    mainStatus = `🏚️ ${damageLabel} (${pctC.toFixed(1)}%)`;
                    color = '#ff8844';
                    break;
                case 'city_destroyed':
                    mainStatus = '💀 Kota ludes hangus!';
                    color = '#ff2222';
                    break;
                default:
                    mainStatus = status.phase;
            }

            // Tambahkan info kerusakan jika kota sudah terkena
            let extra = '';
            if (status.phase === 'city_damage' || status.phase === 'city_destroyed') {
                extra = ` · ${damageLabel}`;
            } else if (status.phase === 'wave' && cTotal > 0 && pctC > 0) {
                extra = ` · ${damageLabel}`;
            }

            statusEl.innerHTML = mainStatus + extra;
            statusEl.style.color = color;
        }

        // ----- Fungsi fisi -----
        function triggerFission(atom) {
            if (atom.isSplit) return;
            atom.isSplit = true;
            totalEnergy += CONFIG.ENERGY_PER_FISSION;
            status.uraniumSplit++;
            status.lastFissionTime = performance.now();

            // Jika status masih idle/arming/ignition, ubah ke ignition/chain
            if (!status.firstFission) {
                status.firstFission = true;
                if (status.phase === 'arming' || status.phase === 'idle') {
                    status.phase = 'ignition';
                }
                // Aktifkan gelombang
                const bombPos = window.bombPos || { x: 0, y: 0 };
                shockwave = {
                    x: bombPos.x,
                    y: bombPos.y,
                    radius: 5,
                    maxRadius: Math.max(W, H) * CONFIG.WAVE_MAX_RADIUS,
                    life: 1.0,
                };
                bigWave = {
                    x: bombPos.x,
                    y: bombPos.y,
                    radius: 5,
                    maxRadius: Math.max(W, H) * CONFIG.WAVE_MAX_RADIUS * 1.2,
                    alpha: 1.0,
                };
                screenShake = 20;
                shockwaveActive = true;
            }

            // Cek persentase uranium
            const pctU = status.uraniumTotal > 0 ? (status.uraniumSplit / status.uraniumTotal) * 100 : 0;
            if (pctU >= 1.0 && status.phase !== 'chain' && status.phase !== 'wave') {
                status.phase = 'chain';
            }

            // Jika semua uranium pecah → langsung wave
            if (status.uraniumSplit >= status.uraniumTotal && status.uraniumTotal > 0) {
                status.phase = 'wave';
                status.waveTriggered = true;
                status.fizzleCheckDone = true;
            }

            // Efek flash kecil
            energyFlashes.push({
                x: atom.x,
                y: atom.y,
                radius: 2,
                maxRadius: 40 + rand(0, 30),
                life: 1.0,
                decay: 0.015 + rand(0, 0.01),
            });

            // Lepaskan partikel: 3 neutron, 2 proton, 2 elektron
            for (let i = 0; i < 2; i++) {
                const angle = rand(0, Math.PI * 2);
                const spd = CONFIG.PROTON_SPEED * (0.7 + rand(0, 0.6));
                particles.push({
                    x: atom.x,
                    y: atom.y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    type: 'proton',
                    life: 1.0,
                    alpha: 1.0,
                    decay: 0.002,
                    radius: CONFIG.PARTICLE_RADIUS,
                });
                const angle2 = rand(0, Math.PI * 2);
                const spd2 = CONFIG.ELECTRON_SPEED * (0.8 + rand(0, 0.8));
                particles.push({
                    x: atom.x,
                    y: atom.y,
                    vx: Math.cos(angle2) * spd2,
                    vy: Math.sin(angle2) * spd2,
                    type: 'electron',
                    life: 1.0,
                    alpha: 1.0,
                    decay: 0.003,
                    radius: CONFIG.PARTICLE_RADIUS * 0.6,
                });
            }
            for (let i = 0; i < CONFIG.FISSION_NEUTRONS; i++) {
                const angle = rand(0, Math.PI * 2);
                const spd = CONFIG.NEUTRON_SPEED * (0.6 + rand(0, 0.8));
                particles.push({
                    x: atom.x,
                    y: atom.y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    type: 'neutron',
                    life: 1.0,
                    alpha: 1.0,
                    decay: 0.001,
                    radius: CONFIG.PARTICLE_RADIUS,
                });
            }

            const maxP = getMaxParticles();
            if (particles.length > maxP) {
                particles.splice(0, particles.length - maxP);
            }

            updateUI();
            updateStatus();
        }

        // ----- Tembak neutron -----
        function shootNeutrons(fromX, fromY) {
            if (status.phase === 'city_destroyed') return;

            if (status.phase === 'idle') {
                status.phase = 'arming';
                updateStatus();
            }

            const bombPos = window.bombPos || { x: 0, y: 0 };
            const angle = Math.atan2(bombPos.y - fromY, bombPos.x - fromX);
            const n = parseInt(neutronPerClick.value) || 1;
            for (let i = 0; i < n; i++) {
                const spread = (Math.random() - 0.5) * 0.25;
                const a = angle + spread;
                const spd = CONFIG.NEUTRON_SPEED * (0.9 + rand(0, 0.2));
                particles.push({
                    x: fromX,
                    y: fromY,
                    vx: Math.cos(a) * spd,
                    vy: Math.sin(a) * spd,
                    type: 'neutron',
                    life: 1.0,
                    alpha: 1.0,
                    decay: 0.001,
                    radius: CONFIG.PARTICLE_RADIUS,
                });
            }
            const maxP = getMaxParticles();
            if (particles.length > maxP) {
                particles.splice(0, particles.length - maxP);
            }
            updateUI();
        }

        // ----- Update UI -----
        function updateUI() {
            let u = 0, c = 0;
            for (let a of atoms) {
                if (a.isSplit) continue;
                if (a.isUranium) u++;
                else c++;
            }
            uCountEl.textContent = u;
            cCountEl.textContent = c;
            pCountEl.textContent = particles.length;
            energyEl.textContent = Math.round(totalEnergy * 10) / 10;
        }

        // ----- Loop animasi -----
        function animate() {
            speed = parseFloat(speedSlider.value) || 1.0;
            speedLabel.textContent = speed.toFixed(1);

            // ---- Cek fizzle / selesai fisi ----
            const uTotal = status.uraniumTotal;
            const uSplit = status.uraniumSplit;
            const pctU = uTotal > 0 ? (uSplit / uTotal) * 100 : 0;

            // Jika fisi sudah pernah terjadi dan belum masuk wave
            if (status.firstFission && !status.waveTriggered && (status.phase === 'ignition' || status.phase === 'chain')) {
                const now = performance.now();
                const timeSinceLastFission = now - status.lastFissionTime;
                // Jika sudah > 1.5 detik tanpa fisi baru
                if (timeSinceLastFission > CONFIG.FIZZLE_TIMEOUT) {
                    if (pctU > 1.0) {
                        // Fisi selesai dengan sukses (>1% uranium pecah)
                        status.phase = 'wave';
                        status.waveTriggered = true;
                        status.fizzleCheckDone = true;
                    } else {
                        // Fisi gagal (<=1% uranium pecah)
                        status.phase = 'fizzle';
                        status.fizzleCheckDone = true;
                    }
                    updateStatus();
                }
            }

            // Jika semua uranium pecah tapi wave belum trigger (misal karena semua pecah sekaligus)
            if (uSplit >= uTotal && uTotal > 0 && !status.waveTriggered) {
                status.phase = 'wave';
                status.waveTriggered = true;
                status.fizzleCheckDone = true;
                updateStatus();
            }

            // Gelombang kejut
            if (shockwave) {
                shockwave.radius += CONFIG.WAVE_SPEED * speed;
                shockwave.life -= 0.003 * speed;
                for (let a of atoms) {
                    if (a.isSplit || a.isUranium) continue;
                    const dist = Math.hypot(a.x - shockwave.x, a.y - shockwave.y);
                    if (dist < shockwave.radius + 20) {
                        a.vibration = Math.max(a.vibration, 2.5 * (1 - dist / shockwave.maxRadius));
                    }
                }
                if (shockwave.radius > shockwave.maxRadius || shockwave.life <= 0) {
                    shockwave = null;
                }
            }

            // Gelombang cahaya
            if (bigWave) {
                bigWave.radius += CONFIG.WAVE_SPEED * speed;
                bigWave.alpha -= 0.0015 * speed;
                if (bigWave.alpha <= 0) bigWave = null;
            }

            // Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * speed;
                p.y += p.vy * speed;
                p.vx *= CONFIG.PARTICLE_DAMP;
                p.vy *= CONFIG.PARTICLE_DAMP;

                if (p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
                    p.life = 0;
                }

                p.life -= p.decay * speed;
                p.alpha = Math.max(0, p.life);

                if (p.alpha <= 0.01) {
                    particles.splice(i, 1);
                    continue;
                }

                // Neutron → uranium (hanya jika fisi masih aktif atau belum selesai)
                if (p.type === 'neutron' && p.alpha > 0.2 && status.phase !== 'wave' && status.phase !== 'fizzle') {
                    for (let a of atoms) {
                        if (a.isSplit || !a.isUranium) continue;
                        const dist = Math.hypot(p.x - a.x, p.y - a.y);
                        if (dist < CONFIG.ATOM_RADIUS + p.radius) {
                            triggerFission(a);
                            p.life = 0;
                            break;
                        }
                    }
                }

                // Partikel → atom kota (hancurkan)
                if (p.alpha > 0.2) {
                    for (let a of atoms) {
                        if (a.isSplit || a.isUranium) continue;
                        const dist = Math.hypot(p.x - a.x, p.y - a.y);
                        if (dist < CONFIG.ATOM_RADIUS + p.radius) {
                            energyFlashes.push({
                                x: a.x,
                                y: a.y,
                                radius: 2,
                                maxRadius: 15 + rand(0, 10),
                                life: 1.0,
                                decay: 0.04 + rand(0, 0.02),
                            });
                            a.isSplit = true;
                            status.cityDestroyed++;
                            if (!status.firstCityHit) {
                                status.firstCityHit = true;
                                if (status.phase !== 'city_destroyed' && status.phase !== 'wave') {
                                    status.phase = 'city_damage';
                                }
                            }
                            // Update status kerusakan kota
                            const pctC = status.cityTotal > 0 ? (status.cityDestroyed / status.cityTotal) * 100 : 0;
                            if (pctC >= 100) {
                                status.phase = 'city_destroyed';
                            } else if (status.phase === 'wave' || status.phase === 'chain') {
                                // tetap di wave/chain tapi update damage
                            }
                            p.life = 0;
                            updateStatus();
                            break;
                        }
                    }
                }
            }

            // Flash kecil
            for (let i = energyFlashes.length - 1; i >= 0; i--) {
                const f = energyFlashes[i];
                f.radius += (f.maxRadius - f.radius) * 0.06 * speed;
                f.life -= f.decay * speed;
                if (f.life <= 0) energyFlashes.splice(i, 1);
            }

            const maxP = getMaxParticles();
            if (particles.length > maxP) {
                particles.splice(0, particles.length - maxP);
            }

            // Screen shake
            if (screenShake > 0.1) {
                screenShake *= CONFIG.SHAKE_DECAY;
            } else {
                screenShake = 0;
            }

            // ---- Gambar ----
            ctx.save();
            if (screenShake > 0.5) {
                const dx = (Math.random() - 0.5) * screenShake * 0.8;
                const dy = (Math.random() - 0.5) * screenShake * 0.8;
                ctx.translate(dx, dy);
            }

            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, W, H);

            // Atom
            for (let a of atoms) {
                if (a.isSplit) continue;
                let ox = 0, oy = 0;
                if (a.vibration > 0.1) {
                    ox = (Math.random() - 0.5) * a.vibration * 1.5;
                    oy = (Math.random() - 0.5) * a.vibration * 1.5;
                    a.vibration *= 0.92;
                } else {
                    a.vibration = 0;
                }
                const x = a.x + ox;
                const y = a.y + oy;

                ctx.beginPath();
                ctx.arc(x, y, CONFIG.ATOM_RADIUS, 0, Math.PI * 2);
                if (a.isUranium) {
                    ctx.fillStyle = '#ff2222';
                    ctx.shadowBlur = 2;
                    ctx.shadowColor = '#ff2222';
                } else {
                    ctx.fillStyle = '#5e7a8a';
                    ctx.shadowBlur = 1;
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Gelombang cahaya besar
            if (bigWave) {
                const alpha = bigWave.alpha * 0.5;
                const grad = ctx.createRadialGradient(bigWave.x, bigWave.y, 0, bigWave.x, bigWave.y, bigWave.radius);
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.9})`);
                grad.addColorStop(0.2, `rgba(255, 200, 100, ${alpha * 0.7})`);
                grad.addColorStop(0.5, `rgba(255, 100, 50, ${alpha * 0.4})`);
                grad.addColorStop(0.8, `rgba(200, 50, 150, ${alpha * 0.2})`);
                grad.addColorStop(1, `rgba(100, 0, 200, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(bigWave.x, bigWave.y, bigWave.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = `rgba(255, 200, 100, ${alpha * 0.3})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(bigWave.x, bigWave.y, bigWave.radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Gelombang kejut
            if (shockwave) {
                const alpha = shockwave.life * 0.5;
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(shockwave.x, shockwave.y, shockwave.radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Flash kecil
            for (let f of energyFlashes) {
                const alpha = f.life * 0.7;
                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.9})`);
                grad.addColorStop(0.15, `rgba(255, 200, 100, ${alpha * 0.8})`);
                grad.addColorStop(0.4, `rgba(255, 100, 50, ${alpha * 0.6})`);
                grad.addColorStop(0.7, `rgba(200, 50, 150, ${alpha * 0.4})`);
                grad.addColorStop(1, `rgba(100, 0, 200, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Partikel
            for (let p of particles) {
                if (p.alpha <= 0.02) continue;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius || CONFIG.PARTICLE_RADIUS, 0, Math.PI * 2);
                let color;
                if (p.type === 'neutron') color = '#45f3ff';
                else if (p.type === 'proton') color = '#00ff88';
                else color = '#ffdd44';
                ctx.fillStyle = color;
                ctx.shadowBlur = 4;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }

            ctx.restore();

            // Update UI dan status
            updateUI();
            // Pastikan status damage selalu update
            if (status.firstCityHit && status.phase !== 'city_destroyed' && status.phase !== 'wave') {
                const pctC = status.cityTotal > 0 ? (status.cityDestroyed / status.cityTotal) * 100 : 0;
                if (pctC >= 100) {
                    status.phase = 'city_destroyed';
                    updateStatus();
                } else if (pctC > 0 && status.phase !== 'city_damage') {
                    status.phase = 'city_damage';
                    updateStatus();
                }
            }

            requestAnimationFrame(animate);
        }

        // ----- Event -----
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            shootNeutrons(mx, my);
        });

        resetBtn.addEventListener('click', () => {
            buildWorld();
            status.phase = 'idle';
            status.fizzleCheckDone = false;
            status.waveTriggered = false;
            updateStatus();
        });

        // Toggle kontrol
        toggleBtn.addEventListener('click', () => {
            controlsDiv.classList.toggle('hidden');
            toggleBtn.textContent = controlsDiv.classList.contains('hidden') ? '⚙️' : '⚙️';
        });

        // Slider update nilai
        function updateSliderLabels() {
            bombXval.textContent = bombXSlider.value + '%';
            bombYval.textContent = bombYSlider.value + '%';
            bombSizeVal.textContent = bombSizeSlider.value;
            cityXval.textContent = cityXSlider.value + '%';
            cityYval.textContent = cityYSlider.value + '%';
            cityScaleVal.textContent = cityScaleSlider.value + '%';
        }
        bombXSlider.addEventListener('input', updateSliderLabels);
        bombYSlider.addEventListener('input', updateSliderLabels);
        bombSizeSlider.addEventListener('input', updateSliderLabels);
        cityXSlider.addEventListener('input', updateSliderLabels);
        cityYSlider.addEventListener('input', updateSliderLabels);
        cityScaleSlider.addEventListener('input', updateSliderLabels);

        // Slider perubahan posisi/ukuran → rebuild otomatis
        let rebuildTimeout;
        function scheduleRebuild() {
            clearTimeout(rebuildTimeout);
            rebuildTimeout = setTimeout(() => {
                buildWorld();
                status.phase = 'idle';
                status.fizzleCheckDone = false;
                status.waveTriggered = false;
                updateStatus();
            }, 150);
        }
        bombXSlider.addEventListener('change', scheduleRebuild);
        bombYSlider.addEventListener('change', scheduleRebuild);
        bombSizeSlider.addEventListener('change', scheduleRebuild);
        cityXSlider.addEventListener('change', scheduleRebuild);
        cityYSlider.addEventListener('change', scheduleRebuild);
        cityScaleSlider.addEventListener('change', scheduleRebuild);
        inputU.addEventListener('change', scheduleRebuild);
        inputC.addEventListener('change', scheduleRebuild);

        // ---- Mulai ----
        buildWorld();
        updateSliderLabels();
        animate();
        window.addEventListener('resize', resize);

        console.log('✅ Status "Fisi selesai" diperbaiki: terjadi ketika reaksi berhenti & uranium >1%');
        console.log('✅ Kontrol diperlebar (min-width: 200px)');
    </script>
</body>
