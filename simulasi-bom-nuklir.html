
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Multi-Skala Fisi Nuklir & Kehancuran Kota (E=mc²)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05070a;
            font-family: 'Courier New', Courier, monospace;
            color: #45f3ff;
        }
        canvas {
            display: block;
        }
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 15, 25, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ff3300;
            box-shadow: 0 0 20px rgba(255, 51, 0, 0.3);
            pointer-events: none;
            width: 320px;
        }
        h2 { margin: 0 0 10px 0; font-size: 16px; color: #ff3300; text-shadow: 0 0 5px #ff3300; }
        p { margin: 6px 0; font-size: 12px; color: #a5c6d4; }
        .val { font-weight: bold; color: #fff; }
        #status { font-weight: bold; color: #ffcc00; margin-top: 10px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="control-panel">
        <h2>WEAPON SYSTEM: WEAK INTERACTION</h2>
        <p>Status: <span id="status">SIAP DIKETUK / KLIK SCREEN</span></p>
        <p>Atom Uranium (Bom): <span id="u-count" class="val">0</span></p>
        <p>Atom Kota (Target): <span id="c-count" class="val">0</span></p>
        <p>Neutron Bebas: <span id="n-count" class="val">0</span></p>
        <p>Energi (E=mc²): <span id="energy-mass" class="val">0</span> PetaJoule</p>
    </div>

    <canvas id="simulationCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Representasi Fisika Partikel Sub-Atom Bebas
        class SubParticle {
            constructor(x, y, vx, vy, type) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.type = type; // 'neutron', 'proton', 'electron'
                this.alpha = 1;
                this.life = 1.0;
                
                // Set spesifikasi partikel berdasarkan jenisnya
                if (type === 'neutron') {
                    this.radius = 2.5;
                    this.color = '#45f3ff'; // Biru Cyan (Pemicu fisi)
                    this.decay = 0.002;
                } else if (type === 'proton') {
                    this.radius = 2.5;
                    this.color = '#ffaa00'; // Oranye terang
                    this.decay = 0.008;
                } else { // electron
                    this.radius = 1.2;
                    this.color = '#ffff00'; // Kuning kilat (Sangat cepat)
                    this.decay = 0.02;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // Tambahkan sedikit efek gravitasi bumi pada pecahan berat (Proton/Neutron)
                if (this.type !== 'electron') {
                    this.vy += 0.05;
                }

                // Berikan hambatan udara tipis
                this.vx *= 0.99;
                this.vy *= 0.99;

                this.life -= this.decay;
                this.alpha = Math.max(0, this.life);
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.globalAlpha = 1.0; // Reset
            }
        }

        // Efek Radiasi Foton / Pelepasan Energi Massa Murni (E = mc²)
        class EnergyWave {
            constructor(x, y, power) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = power;
                this.alpha = 1;
            }
            update() {
                this.radius += 12; // Kecepatan rambat radiasi termal/foton
                this.alpha -= 0.015;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                // Gradasi warna dari putih inti ke merah plasma
                let gradient = ctx.createRadialGradient(this.x, this.y, this.radius * 0.1, this.x, this.y, this.radius);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
                gradient.addColorStop(0.2, `rgba(255, 200, 0, ${this.alpha * 0.8})`);
                gradient.addColorStop(0.6, `rgba(255, 50, 0, ${this.alpha * 0.4})`);
                gradient.addColorStop(1, `rgba(255, 0, 0, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        // Makro Komponen: Atom Terikat (Bisa berupa Uranium Core Bom atau Material Bangunan)
        class BoundAtom {
            constructor(x, y, isUranium, parentStructure = null) {
                this.x = x;
                this.y = y;
                this.isUranium = isUranium; 
                this.isSplit = false;
                this.parentStructure = parentStructure; // Mengacu pada objek bangunan gedung
                this.radius = isUranium ? 8 : 5;
            }

            draw() {
                if (this.isSplit) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                if (this.isUranium) {
                    ctx.fillStyle = '#ff1111'; // Merah Pekat Radioaktif berbahaya
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ff1111';
                } else {
                    ctx.fillStyle = '#5a6975'; // Abu baja/beton penyusun materi sipil kota
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Penampung Objek Utama
        const atoms = [];
        const subParticles = [];
        const energyWaves = [];
        let totalEnergyJoules = 0;
        let screenShake = 0;

        // --- PROSEDUR GENERASI DUNIA SIMULASI ---
        const groundY = canvas.height - 60;

        // 1. Membangun Kota Struktural Makro 2D dari Susunan Grid Atom Mikro
        function createBuilding(startX, width, height) {
            const spacing = 12;
            for (let x = startX; x < startX + width; x += spacing) {
                for (let y = groundY - height; y < groundY; y += spacing) {
                    atoms.push(new BoundAtom(x, y, false));
                }
            }
        }

        // Hasilkan beberapa gedung bertingkat di area kanan
        createBuilding(canvas.width * 0.45, 80, 250); // Gedung 1
        createBuilding(canvas.width * 0.55, 120, 400); // Pencakar Langit Pusat
        createBuilding(canvas.width * 0.68, 70, 180); // Gedung Menara 3
        createBuilding(canvas.width * 0.76, 140, 300); // Kompleks Mal Gedung 4

        // 2. Membuat Core Bom Atom Uranium di Langit Kiri Atas
        const bombCenterX = canvas.width * 0.25;
        const bombCenterY = canvas.height * 0.3;
        const bombRadius = 45;

        // Mengisi ruang bundar bom dengan susunan atom Uranium padat
        for (let i = 0; i < 350; i++) {
            let angle = Math.random() * Math.PI * 2;
            let distance = Math.random() * bombRadius;
            let uX = bombCenterX + Math.cos(angle) * distance;
            let uY = bombCenterY + Math.sin(angle) * distance;
            atoms.push(new BoundAtom(uX, uY, true));
        }

        // Pemicu Kejadian: Klik mouse / Sentuhan menembakkan Neutron pemicu awal ke arah Bom
        window.addEventListener('click', (e) => {
            document.getElementById('status').innerText = "REAKSI FISI BERJALAN!";
            document.getElementById('status').style.color = "#ff3300";
            
            // Luncurkan seberkas Neutron Berkecepatan tinggi dari posisi klik menuju inti bom
            let angle = Math.atan2(bombCenterY - e.clientY, bombCenterX - e.clientX);
            for(let k=0; k<5; k++) {
                let spreadAngle = angle + (Math.random() - 0.5) * 0.2;
                subParticles.push(new SubParticle(
                    e.clientX, e.clientY, 
                    Math.cos(spreadAngle) * 15, Math.sin(spreadAngle) * 15, 
                    'neutron'
                ));
            }
        });

        // --- INTERAKSI UTAMA & LOOP ANIMASI ---
        function animate() {
            // Efek Screen Shake jika ada pelepasan energi besar
            ctx.save();
            if (screenShake > 0) {
                let dx = (Math.random() - 0.5) * screenShake;
                let dy = (Math.random() - 0.5) * screenShake;
                ctx.translate(dx, dy);
                screenShake *= 0.92; // Redaman getaran
            }

            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gambar Garis Tanah Horizontal bawah kota
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.strokeStyle = '#15222e';
            ctx.lineWidth = 6;
            ctx.stroke();

            // 1. Gambar & Kelola Semua Ikatan Atom (Kota & Bom)
            let uraniumLeft = 0;
            let cityAtomsLeft = 0;

            atoms.forEach(atom => {
                atom.draw();
                if (!atom.isSplit) {
                    if (atom.isUranium) uraniumLeft++;
                    else cityAtomsLeft++;
                }

});
// 2. Perbarui Gelombang Radiasi Energi Termal (E=mc²)
energyWaves.forEach((wave, wIdx) => {
wave.update();
wave.draw();
// Efek Destruktif Makro: Gelombang energi murni meluluhlantakkan atom kota di jalurnya
atoms.forEach(atom => {
if (!atom.isSplit && !atom.isUranium) {
let distToWave = Math.hypot(atom.x - wave.x, atom.y - wave.y);
// Jika terjangkau oleh radius gelombang ledakan foton termal
if (distToWave < wave.radius && wave.alpha > 0.1) {
atom.isSplit = true; // Energi memutus ikatan molekul bangunan, kota hancur!
// Muntahkan material hancur (Elektron & Proton terlepas dari bangunan)
if (Math.random() < 0.3) {
let fAngle = Math.random() * Math.PI * 2;
let fSpeed = Math.random() * 4 + 2;
subParticles.push(new SubParticle(atom.x, atom.y, Math.cos(fAngle) * fSpeed, Math.sin(fAngle) * fSpeed, 'proton'));
subParticles.push(new SubParticle(atom.x, atom.y, Math.sin(fAngle) * fSpeed * 2, Math.cos(fAngle) * fSpeed * 2, 'electron'));
}
}
}
});
if (wave.alpha <= 0) energyWaves.splice(wIdx, 1);
});
// 3. Perbarui Pergerakan Fisika Partikel Sub-Atom Bebas & Deteksi Tabrakan
subParticles.forEach((part, pIdx) => {
part.update();
part.draw();
// Logika Tabrakan Neutron dengan Atom Uranium (Reaksi Fisi Eksponensial)
if (part.type === 'neutron' && part.alpha > 0.1) {
for (let i = 0; i < atoms.length; i++) {
let atom = atoms[i];
if (!atom.isSplit && atom.isUranium) {
let dist = Math.hypot(part.x - atom.x, part.y - atom.y);
// Terjadi Benturan Fisi Inti!
if (dist < atom.radius + part.radius) {
atom.isSplit = true;
part.alpha = 0; // Neutron pemicu diserap inti induk
// IMPLEMENTASI E=mc²: Massa Hilang dikonversi jadi Energi Murni raksasa
totalEnergyJoules += 15.5; // Akumulasi dalam skala simulasi PetaJoule
screenShake = Math.min(45, screenShake + 3); // Guncangan layar bertambah keras
// Lepaskan gelombang ekspansi energi termal (Cahaya/Panas)
energyWaves.push(new EnergyWave(atom.x, atom.y, 400));
// PEMBELAHAAN INTI: Inti atom pecah memuntahkan sisa partikel penyusunnya
// 1. Elektron terpental super cepat ke segala arah luar kulit atom
for(let e=0; e<2; e++) {
let ea = Math.random() * Math.PI * 2;
let es = Math.random() * 12 + 10;
subParticles.push(new SubParticle(atom.x, atom.y, Math.cos(ea)*es, Math.sin(ea)*es, 'electron'));
}
// 2. Proton (Inti bermuatan positif) terlempar keluar
for(let p=0; p<2; p++) {
let pa = Math.random() * Math.PI * 2;
let ps = Math.random() * 5 + 3;
subParticles.push(new SubParticle(atom.x, atom.y, Math.cos(pa)*ps, Math.sin(pa)*ps, 'proton'));
}
// 3. Domino Multiplikasi: Melontarkan 3 Neutron baru untuk berantai menabrak Uranium lain
for(let n=0; n<3; n++) {
let na = Math.random() * Math.PI * 2;
let ns = Math.random() * 7 + 4; // Kecepatan tinggi neutron bebas
subParticles.push(new SubParticle(atom.x, atom.y, Math.cos(na)*ns, Math.sin(na)*ns, 'neutron'));
}
break;
}
}
}
}
// Hapus partikel jika waktu hidupnya habis
if (part.alpha <= 0) {
subParticles.splice(pIdx, 1);
}
});
// Update Teks Panel Statistik secara Real-Time
document.getElementById('u-count').innerText = uraniumLeft;
document.getElementById('c-count').innerText = cityAtomsLeft;
document.getElementById('n-count').innerText = subParticles.filter(p => p.type === 'neutron').length;
document.getElementById('energy-mass').innerText = totalEnergyJoules.toLocaleString(undefined, {maximumFractionDigits: 1});
if(cityAtomsLeft === 0 && uraniumLeft === 0) {
document.getElementById('status').innerText = "KOTA TOTAL TERDEMOLISI!";
document.getElementById('status').style.color = "#00ff00";
}
ctx.restore();
requestAnimationFrame(animate);
}
animate();



</script>
</body>
</html>
