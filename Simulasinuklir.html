<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💥 Bom Nuklir vs Kota · Fisi & Kehancuran Natural</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #05070a;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        #panel {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(10, 15, 25, 0.92);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #ff3300;
            box-shadow: 0 0 25px rgba(255, 51, 0, 0.25);
            pointer-events: none;
            min-width: 190px;
            backdrop-filter: blur(4px);
            color: #a5c6d4;
            font-size: 13px;
        }
        #panel h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #ff3300;
            text-shadow: 0 0 8px #ff3300;
            letter-spacing: 1px;
        }
        #panel .row {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }
        #panel .val {
            color: #fff;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        #status {
            color: #ffcc00;
            font-weight: bold;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 15, 25, 0.9);
            padding: 12px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 18px 28px;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            font-size: 13px;
            color: #a5c6d4;
        }
        #controls label {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #controls input[type="range"] {
            width: 90px;
            accent-color: #ff3300;
            background: transparent;
            cursor: pointer;
        }
        #controls input[type="number"] {
            width: 50px;
            padding: 2px 4px;
            background: rgba(255,255,255,0.08);
            border: 1px solid #2a3a4a;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
        }
        #controls button {
            background: #ff3300;
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
            box-shadow: 0 0 12px rgba(255,51,0,0.3);
        }
        #controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,51,0,0.6);
        }
        #controls .hint {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
        }
        @media (max-width: 720px) {
            #panel { padding: 12px 14px; min-width: 140px; font-size: 11px; }
            #controls { padding: 10px 16px; gap: 12px; flex-wrap: wrap; }
            #controls input[type="range"] { width: 70px; }
            #controls input[type="number"] { width: 44px; }
        }
    </style>
</head>
<body>

    <div id="panel">
        <h2>☢️ BOM NUKLIR</h2>
        <div class="row"><span>Uranium tersisa</span><span id="u-count" class="val">0</span></div>
        <div class="row"><span>Atom kota</span><span id="c-count" class="val">0</span></div>
        <div class="row"><span>Partikel aktif</span><span id="p-count" class="val">0</span></div>
        <div class="row"><span>Energi (E=mc²)</span><span id="energy" class="val">0</span></div>
        <div id="status">⚡ Klik di layar untuk tembak neutron</div>
    </div>

    <div id="controls">
        <label>Uranium <input type="number" id="inputU" value="300" min="10" max="1000" step="10" /></label>
        <label>Kota <input type="number" id="inputC" value="2000" min="100" max="8000" step="100" /></label>
        <label>Kecepatan <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1.0" /></label>
        <label>Neutron/klik <input type="number" id="neutronPerClick" value="1" min="1" max="20" step="1" /></label>
        <button id="resetBtn">🔄 Reset</button>
        <span class="hint">(klik canvas)</span>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // ============================================================
        //  SIMULASI BOM NUKLIR vs KOTA  (Natural, tanpa gravitasi)
        //  + Efek gempa, gelombang kejut cepat, tanpa pantulan
        // ============================================================

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let W, H;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // DOM refs
        const uCountEl = document.getElementById('u-count');
        const cCountEl = document.getElementById('c-count');
        const pCountEl = document.getElementById('p-count');
        const energyEl = document.getElementById('energy');
        const statusEl = document.getElementById('status');
        const inputU = document.getElementById('inputU');
        const inputC = document.getElementById('inputC');
        const speedSlider = document.getElementById('speedSlider');
        const neutronPerClick = document.getElementById('neutronPerClick');
        const resetBtn = document.getElementById('resetBtn');

        // ----- State -----
        let atoms = [];
        let particles = [];
        let energyFlashes = [];
        let totalEnergy = 0;
        let speed = 1.0;
        let screenShake = 0;
        let shockwave = null;
        let shockwaveActive = false; // agar hanya dibuat sekali

        // Konfigurasi
        const CONFIG = {
            ATOM_RADIUS: 4,
            NEUTRON_SPEED: 6.0,
            PROTON_SPEED: 4.5,
            ELECTRON_SPEED: 8.0,
            FISSION_NEUTRONS: 3,
            ENERGY_PER_FISSION: 15,
            MAX_PARTICLES: 3000,
            PARTICLE_DAMP: 0.998,
            FLASH_DECAY: 0.02,
            SHOCKWAVE_SPEED: 5.5,   // lebih cepat dari partikel
            SHAKE_DECAY: 0.94,
        };

        // ----- Fungsi bantu -----
        function rand(min, max) { return Math.random() * (max - min) + min; }

        // ----- Bangun dunia -----
        function buildWorld() {
            atoms = [];
            particles = [];
            energyFlashes = [];
            totalEnergy = 0;
            screenShake = 0;
            shockwave = null;
            shockwaveActive = false;

            const uCount = parseInt(inputU.value) || 300;
            const cCount = parseInt(inputC.value) || 2000;

            // 1. Bom Uranium (pusat di kiri atas)
            const bombCX = W * 0.22;
            const bombCY = H * 0.28;
            const bombRadius = Math.min(W, H) * 0.08;
            for (let i = 0; i < uCount; i++) {
                const angle = rand(0, Math.PI * 2);
                const dist = rand(0, bombRadius);
                const x = bombCX + Math.cos(angle) * dist;
                const y = bombCY + Math.sin(angle) * dist;
                atoms.push({ x, y, isUranium: true, isSplit: false, vibration: 0 });
            }

            // 2. Kota (sebelah kanan) – bangunan padat
            const spacing = 8;
            const buildings = [
                { x: W * 0.45, y: H * 0.50, w: 120, h: 220 },
                { x: W * 0.58, y: H * 0.45, w: 150, h: 280 },
                { x: W * 0.73, y: H * 0.55, w: 100, h: 180 },
                { x: W * 0.82, y: H * 0.48, w: 130, h: 240 },
                { x: W * 0.92, y: H * 0.60, w: 80, h: 130 },
            ];
            let count = 0;
            for (let b of buildings) {
                for (let x = b.x; x < b.x + b.w; x += spacing) {
                    for (let y = b.y; y < b.y + b.h; y += spacing) {
                        if (count >= cCount) break;
                        if (Math.random() < 0.85) {
                            atoms.push({
                                x: x + rand(-2, 2),
                                y: y + rand(-2, 2),
                                isUranium: false,
                                isSplit: false,
                                vibration: 0
                            });
                            count++;
                        }
                    }
                    if (count >= cCount) break;
                }
                if (count >= cCount) break;
            }
            // Jika masih kurang, tambahkan acak
            while (count < cCount) {
                const x = rand(W * 0.40, W - 20);
                const y = rand(H * 0.30, H - 20);
                atoms.push({ x, y, isUranium: false, isSplit: false, vibration: 0 });
                count++;
            }

            updateUI();
        }

        // ----- Fisi (pecah atom uranium) -----
        function triggerFission(atom) {
            if (atom.isSplit) return;
            atom.isSplit = true;
            totalEnergy += CONFIG.ENERGY_PER_FISSION;

            // Aktifkan gelombang kejut pada fisi pertama (segera)
            if (!shockwaveActive) {
                shockwaveActive = true;
                const bombCX = W * 0.22;
                const bombCY = H * 0.28;
                shockwave = {
                    x: bombCX,
                    y: bombCY,
                    radius: 10,
                    maxRadius: Math.max(W, H) * 1.3,
                    life: 1.0,
                };
                screenShake = 20;
            }

            // Efek ledakan gradien (merah, orange, ungu)
            energyFlashes.push({
                x: atom.x,
                y: atom.y,
                radius: 5,
                maxRadius: 80 + rand(0, 60),
                life: 1.0,
                decay: 0.015 + rand(0, 0.01),
            });

            // Lepaskan partikel: 2 proton (hijau), 2 elektron (kuning), 3 neutron (biru)
            for (let i = 0; i < 2; i++) {
                const angle = rand(0, Math.PI * 2);
                const spd = CONFIG.PROTON_SPEED * (0.7 + rand(0, 0.6));
                particles.push({
                    x: atom.x,
                    y: atom.y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    type: 'proton',
                    life: 1.0,
                    alpha: 1.0,
                    decay: 0.002,
                });
                const angle2 = rand(0, Math.PI * 2);
                const spd2 = CONFIG.ELECTRON_SPEED * (0.8 + rand(0, 0.8));
                particles.push({
                    x: atom.x,
                    y: atom.y,
                    vx: Math.cos(angle2) * spd2,
                    vy: Math.sin(angle2) * spd2,
                    type: 'electron',
                    life: 1.0,
                    alpha: 1.0,
                    decay: 0.003,
                });
            }
            for (let i = 0; i < CONFIG.FISSION_NEUTRONS; i++) {
                const angle = rand(0, Math.PI * 2);
                const spd = CONFIG.NEUTRON_SPEED * (0.6 + rand(0, 0.8));
                particles.push({
                    x: atom.x,
                    y: atom.y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    type: 'neutron',
                    life: 1.0,
                    alpha: 1.0,
                    decay: 0.001,
                });
            }

            // Batasi jumlah partikel
            if (particles.length > CONFIG.MAX_PARTICLES) {
                particles.splice(0, particles.length - CONFIG.MAX_PARTICLES);
            }
            updateUI();
        }

        // ----- Tembakkan neutron dari posisi klik menuju bom -----
        function shootNeutrons(fromX, fromY) {
            // Cari pusat bom (rata-rata posisi uranium yang belum pecah)
            let ux = 0, uy = 0, count = 0;
            for (let a of atoms) {
                if (!a.isSplit && a.isUranium) {
                    ux += a.x;
                    uy += a.y;
                    count++;
                }
            }
            if (count === 0) {
                // jika tidak ada uranium, arahkan ke area bom semula
                ux = W * 0.22;
                uy = H * 0.28;
            } else {
                ux /= count;
                uy /= count;
            }

            const angle = Math.atan2(uy - fromY, ux - fromX);
            const n = parseInt(neutronPerClick.value) || 1;
            for (let i = 0; i < n; i++) {
                const spread = (Math.random() - 0.5) * 0.25;
                const a = angle + spread;
                const spd = CONFIG.NEUTRON_SPEED * (0.9 + rand(0, 0.2));
                particles.push({
                    x: fromX,
                    y: fromY,
                    vx: Math.cos(a) * spd,
                    vy: Math.sin(a) * spd,
                    type: 'neutron',
                    life: 1.0,
                    alpha: 1.0,
                    decay: 0.001,
                });
            }
            if (particles.length > CONFIG.MAX_PARTICLES) {
                particles.splice(0, particles.length - CONFIG.MAX_PARTICLES);
            }
            statusEl.textContent = '💥 FISI BERLANGSUNG!';
            statusEl.style.color = '#ff3300';
            updateUI();
        }

        // ----- Update UI -----
        function updateUI() {
            let u = 0, c = 0;
            for (let a of atoms) {
                if (a.isSplit) continue;
                if (a.isUranium) u++;
                else c++;
            }
            uCountEl.textContent = u;
            cCountEl.textContent = c;
            pCountEl.textContent = particles.length;
            energyEl.textContent = Math.round(totalEnergy * 10) / 10;
            if (u === 0 && totalEnergy > 0) {
                statusEl.textContent = '☢️ BOM TELAH MELEDAK — KOTA HANCUR!';
                statusEl.style.color = '#ffaa00';
            }
        }

        // ----- Loop utama -----
        function animate() {
            // Update kecepatan
            speed = parseFloat(speedSlider.value) || 1.0;

            // ---- Update gelombang kejut (aktif sejak fisi pertama) ----
            if (shockwave) {
                shockwave.radius += CONFIG.SHOCKWAVE_SPEED * speed;
                shockwave.life -= 0.004 * speed;
                // Efek pada atom kota: getaran
                for (let a of atoms) {
                    if (a.isSplit || a.isUranium) continue;
                    const dist = Math.hypot(a.x - shockwave.x, a.y - shockwave.y);
                    if (dist < shockwave.radius + 20) {
                        a.vibration = Math.max(a.vibration, 2.5 * (1 - dist / shockwave.maxRadius));
                    }
                }
                if (shockwave.radius > shockwave.maxRadius || shockwave.life <= 0) {
                    shockwave = null;
                }
            }

            // ---- Update partikel ----
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                // Gerak lurus tanpa gravitasi
                p.x += p.vx * speed;
                p.y += p.vy * speed;
                // Redaman kecil
                p.vx *= CONFIG.PARTICLE_DAMP;
                p.vy *= CONFIG.PARTICLE_DAMP;

                // Jika partikel keluar dari layar, hapus langsung (tanpa pantulan)
                if (p.x < -10 || p.x > W + 10 || p.y < -10 || p.y > H + 10) {
                    p.life = 0;
                }

                // Decay
                p.life -= p.decay * speed;
                p.alpha = Math.max(0, p.life);

                if (p.alpha <= 0.01) {
                    particles.splice(i, 1);
                    continue;
                }

                // ---- Deteksi tabrakan ----
                // Jika neutron mengenai uranium → fisi
                if (p.type === 'neutron' && p.alpha > 0.2) {
                    for (let a of atoms) {
                        if (a.isSplit || !a.isUranium) continue;
                        const dist = Math.hypot(p.x - a.x, p.y - a.y);
                        if (dist < CONFIG.ATOM_RADIUS + 2) {
                            triggerFission(a);
                            p.life = 0; // neutron diserap
                            break;
                        }
                    }
                }

                // Jika partikel (apa saja) mengenai atom kota → keduanya hilang
                if (p.alpha > 0.2) {
                    for (let a of atoms) {
                        if (a.isSplit || a.isUranium) continue;
                        const dist = Math.hypot(p.x - a.x, p.y - a.y);
                        if (dist < CONFIG.ATOM_RADIUS + 2) {
                            // Atom kota meledak kecil (efek flash)
                            energyFlashes.push({
                                x: a.x,
                                y: a.y,
                                radius: 2,
                                maxRadius: 20 + rand(0, 15),
                                life: 1.0,
                                decay: 0.04 + rand(0, 0.02),
                            });
                            a.isSplit = true;
                            p.life = 0; // partikel hilang
                            break;
                        }
                    }
                }
            }

            // ---- Update energyFlashes (efek gradien) ----
            for (let i = energyFlashes.length - 1; i >= 0; i--) {
                const f = energyFlashes[i];
                f.radius += (f.maxRadius - f.radius) * 0.05 * speed;
                f.life -= f.decay * speed;
                if (f.life <= 0) {
                    energyFlashes.splice(i, 1);
                }
            }

            // ---- Batasi jumlah partikel ----
            if (particles.length > CONFIG.MAX_PARTICLES) {
                particles.splice(0, particles.length - CONFIG.MAX_PARTICLES);
            }

            // ---- Update screen shake ----
            if (screenShake > 0.1) {
                screenShake *= CONFIG.SHAKE_DECAY;
            } else {
                screenShake = 0;
            }

            // ---- Gambar ----
            ctx.save();
            // Screen shake
            if (screenShake > 0.5) {
                const dx = (Math.random() - 0.5) * screenShake * 0.8;
                const dy = (Math.random() - 0.5) * screenShake * 0.8;
                ctx.translate(dx, dy);
            }

            // Background
            ctx.fillStyle = '#05070a';
            ctx.fillRect(0, 0, W, H);

            // Gambar atom (kota + uranium)
            for (let a of atoms) {
                if (a.isSplit) continue;
                // Getaran jika ada
                let ox = 0, oy = 0;
                if (a.vibration > 0.1) {
                    ox = (Math.random() - 0.5) * a.vibration * 1.5;
                    oy = (Math.random() - 0.5) * a.vibration * 1.5;
                    a.vibration *= 0.92; // redaman getaran
                } else {
                    a.vibration = 0;
                }
                const x = a.x + ox;
                const y = a.y + oy;

                ctx.beginPath();
                ctx.arc(x, y, CONFIG.ATOM_RADIUS, 0, Math.PI * 2);
                if (a.isUranium) {
                    ctx.fillStyle = '#ff2222';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ff2222';
                } else {
                    ctx.fillStyle = '#5e7a8a';
                    ctx.shadowBlur = 2;
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                }
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Gambar gelombang kejut (efek visual)
            if (shockwave) {
                const alpha = shockwave.life * 0.4;
                const grad = ctx.createRadialGradient(shockwave.x, shockwave.y, 0, shockwave.x, shockwave.y, shockwave.radius);
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.3})`);
                grad.addColorStop(0.3, `rgba(255, 200, 100, ${alpha * 0.2})`);
                grad.addColorStop(0.7, `rgba(200, 50, 150, ${alpha * 0.1})`);
                grad.addColorStop(1, `rgba(100, 0, 200, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(shockwave.x, shockwave.y, shockwave.radius, 0, Math.PI * 2);
                ctx.fill();

                // Lingkaran tepi
                ctx.strokeStyle = `rgba(255, 200, 100, ${alpha * 0.5})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(shockwave.x, shockwave.y, shockwave.radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Gambar energyFlashes (gradien merah, orange, ungu)
            for (let f of energyFlashes) {
                const alpha = f.life * 0.7;
                const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.9})`);
                grad.addColorStop(0.15, `rgba(255, 200, 100, ${alpha * 0.8})`);
                grad.addColorStop(0.4, `rgba(255, 100, 50, ${alpha * 0.6})`);
                grad.addColorStop(0.7, `rgba(200, 50, 150, ${alpha * 0.4})`);
                grad.addColorStop(1, `rgba(100, 0, 200, 0)`);
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Gambar partikel
            for (let p of particles) {
                if (p.alpha <= 0.02) continue;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                let color;
                if (p.type === 'neutron') color = '#45f3ff';
                else if (p.type === 'proton') color = '#00ff88'; // hijau terang
                else color = '#ffdd44';
                ctx.fillStyle = color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }

            ctx.restore();

            // Update UI
            updateUI();

            requestAnimationFrame(animate);
        }

        // ----- Event: Klik canvas untuk tembak neutron -----
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            shootNeutrons(mx, my);
        });

        // ----- Reset -----
        resetBtn.addEventListener('click', () => {
            buildWorld();
            statusEl.textContent = '⚡ Klik di layar untuk tembak neutron';
            statusEl.style.color = '#ffcc00';
            screenShake = 0;
            shockwave = null;
            shockwaveActive = false;
        });

        // ----- Inisialisasi -----
        buildWorld();
        animate();

        // Resize ulang dunia jika window berubah (opsional)
        window.addEventListener('resize', () => {
            resize();
            // Tidak rebuild otomatis, biarkan user reset manual
        });

        console.log('💥 Simulasi Bom Nuklir Natural + Gempa Cepat siap!');
        console.log('🖱️ Klik di layar untuk menembak neutron ke arah bom.');
    </script>
</body>
</html>
